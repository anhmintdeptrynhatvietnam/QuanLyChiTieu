<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- App Rounded Rect Frame -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle Highlight Circle -->
  <circle cx="256" cy="120" r="180" fill="#ffffff" opacity="0.08"/>

  <!-- Golden Coin / Wallet Icon with Shadow -->
  <g filter="url(#dropShadow)">
    <circle cx="256" cy="256" r="140" fill="url(#coinGrad)" stroke="#fef08a" stroke-width="12"/>
    <circle cx="256" cy="256" r="110" fill="none" stroke="#fef3c7" stroke-width="4" stroke-dasharray="8 8" opacity="0.6"/>
    
    <!-- Currency / Wallet Symbol inside Coin -->
    <text x="256" y="295" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="130" font-weight="900" fill="#ffffff" letter-spacing="-2">₫</text>
  </g>
</svg>
