<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sổ Thu Chi - Quản Lý Chi Tiêu Cá Nhân</title>
  <meta name="description" content="Ứng dụng quản lý chi tiêu cá nhân thuần Frontend, hoạt động offline và tự động đồng bộ Google Sheets.">
  <meta name="theme-color" content="#2563eb">
  
  <!-- Mobile & PWA Settings -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Sổ Thu Chi">
  
  <!-- App Icons -->
  <link rel="icon" type="image/svg+xml" href="./assets/icons/icon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="./assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="./manifest.json">

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="./css/variables.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/layouts.css">

  <!-- External Libraries via CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <div class="app-container">
    <!-- Desktop Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="brand-logo">
          <i data-lucide="wallet-cards" style="width: 20px; height: 20px;"></i>
        </div>
        <div>
          <h2 style="font-size: var(--font-size-base); font-weight: 700;">Sổ Thu Chi</h2>
          <small style="color: var(--text-muted); font-size: 11px;">Local & Google Sheets</small>
        </div>
      </div>

      <nav class="sidebar-nav">
        <button class="nav-link active" data-view="dashboard">
          <i data-lucide="layout-dashboard" style="width: 18px; height: 18px;"></i>
          <span>Tổng quan</span>
        </button>
        <button class="nav-link" data-view="transactions">
          <i data-lucide="arrow-left-right" style="width: 18px; height: 18px;"></i>
          <span>Giao dịch</span>
        </button>
        <button class="nav-link" data-view="wallets">
          <i data-lucide="wallet" style="width: 18px; height: 18px;"></i>
          <span>Sổ ví & Tài khoản</span>
        </button>
        <button class="nav-link" data-view="debts">
          <i data-lucide="hand-coins" style="width: 18px; height: 18px;"></i>
          <span>Sổ Vay & Nợ</span>
        </button>
        <button class="nav-link" data-view="budgets">
          <i data-lucide="pie-chart" style="width: 18px; height: 18px;"></i>
          <span>Hạn mức ngân sách</span>
        </button>
        <button class="nav-link" data-view="analytics">
          <i data-lucide="trending-up" style="width: 18px; height: 18px;"></i>
          <span>Báo cáo & Phân tích</span>
        </button>
        <button class="nav-link" data-view="settings">
          <i data-lucide="settings" style="width: 18px; height: 18px;"></i>
          <span>Cài đặt & Đồng bộ</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <button class="btn btn-secondary w-full" id="btn-theme-toggle">
          <i data-lucide="moon" id="theme-icon" style="width: 16px; height: 16px;"></i>
          <span id="theme-text">Chế độ tối</span>
        </button>
      </div>
    </aside>

    <!-- Main Content Area -->
    <div class="main-wrapper">
      <!-- Top Header -->
      <header class="top-header">
        <div class="flex items-center gap-3">
          <h1 id="page-title" style="font-size: var(--font-size-lg); font-weight: 700;">Tổng quan</h1>
        </div>

        <div class="flex items-center gap-3">
          <div id="sync-status-badge" class="badge badge-subtle" style="cursor: pointer; transition: all 0.2s ease;" role="button" tabindex="0" aria-label="Mở bảng Đồng Bộ Google Sheets" title="Bấm để mở bảng Đồng Bộ Google Sheets (2 Chiều)">
            <i data-lucide="cloud-off" style="width: 14px; height: 14px;"></i>
            <span id="sync-status-text">Chưa kết nối Google</span>
          </div>

          <button class="btn btn-primary" id="btn-add-transaction-header">
            <i data-lucide="plus" style="width: 16px; height: 16px;"></i>
            <span>Ghi chép</span>
          </button>
        </div>
      </header>

      <!-- View Containers -->
      <main class="content-area">
        <section id="view-dashboard" class="view-section active"></section>
        <section id="view-transactions" class="view-section"></section>
        <section id="view-wallets" class="view-section"></section>
        <section id="view-debts" class="view-section"></section>
        <section id="view-budgets" class="view-section"></section>
        <section id="view-analytics" class="view-section"></section>
        <section id="view-settings" class="view-section"></section>
      </main>
    </div>

    <!-- Mobile Bottom Navigation Bar -->
    <nav class="mobile-nav">
      <button class="mobile-nav-item active" data-view="dashboard">
        <i data-lucide="layout-dashboard" style="width: 20px; height: 20px;"></i>
        <span>Tổng quan</span>
      </button>
      <button class="mobile-nav-item" data-view="transactions">
        <i data-lucide="arrow-left-right" style="width: 20px; height: 20px;"></i>
        <span>Giao dịch</span>
      </button>
      <button class="mobile-nav-item" data-view="analytics">
        <i data-lucide="trending-up" style="width: 20px; height: 20px;"></i>
        <span>Báo cáo</span>
      </button>
      <button class="mobile-nav-item" data-view="debts">
        <i data-lucide="hand-coins" style="width: 20px; height: 20px;"></i>
        <span>Vay/Nợ</span>
      </button>
      <button class="mobile-nav-item" data-view="wallets">
        <i data-lucide="wallet" style="width: 20px; height: 20px;"></i>
        <span>Ví tiền</span>
      </button>
      <button class="mobile-nav-item" data-view="settings">
        <i data-lucide="settings" style="width: 20px; height: 20px;"></i>
        <span>Cài đặt</span>
      </button>
    </nav>

    <!-- Floating Action Button (FAB) -->
    <button class="fab-btn" id="btn-fab-add" title="Ghi chép nhanh" aria-label="Ghi chép nhanh">
      <i data-lucide="plus" style="width: 28px; height: 28px;"></i>
    </button>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container"></div>

  <!-- Main JavaScript Module -->
  <script type="module" src="./js/app.js"></script>
</body>
</html>
