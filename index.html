<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://unpkg.com https://cdn.jsdelivr.net https://www.gstatic.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.googleusercontent.com; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://unpkg.com https://cdn.jsdelivr.net https://www.gstatic.com https://fonts.googleapis.com https://fonts.gstatic.com; frame-src https://*.firebaseapp.com https://accounts.google.com https://apis.google.com; worker-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Sổ Thu Chi - Quản Lý Chi Tiêu Cá Nhân</title>
  <meta name="description" content="Ứng dụng quản lý chi tiêu cá nhân thuần Frontend, hoạt động offline và đồng bộ đám mây realtime qua Firebase.">
  <meta name="theme-color" content="#4f46e5">
  
  <!-- Mobile & PWA Settings -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Sổ Thu Chi">
  
  <!-- App Icons -->
  <link rel="icon" type="image/svg+xml" href="./assets/icons/icon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="./assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="./manifest.json">

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" crossorigin="anonymous">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="./css/variables.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/layouts.css">
  <link rel="stylesheet" href="./css/ui.css">
  <link rel="stylesheet" href="./css/sheets.css">
  <link rel="stylesheet" href="./css/views/dashboard.css">
  <link rel="stylesheet" href="./css/views/transactions.css">
  <link rel="stylesheet" href="./css/views/wallets.css">
  <link rel="stylesheet" href="./css/views/debts.css">
  <link rel="stylesheet" href="./css/views/budgets.css">
  <link rel="stylesheet" href="./css/views/analytics.css">
  <link rel="stylesheet" href="./css/views/settings.css">

  <!-- External Libraries via CDN -->
  <script src="https://unpkg.com/lucide@1.72.0/dist/umd/lucide.min.js" integrity="sha384-LJKEYnLhvei+XTxKjLahwKnS/kWFWfkb3n+v8n7YKWAAS3oamYHQyT4Bwch3XplL" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.6.1/dist/chart.umd.min.js" integrity="sha384-Emf5ZVIUiarAdhkgtqK+5/Z5qIvM6QoVrS+qAVtfyZVuD5lIHrac0me485+Antp0" crossorigin="anonymous"></script>
</head>
<body>
  <div class="app-container">
    <!-- Desktop Sidebar (≥1024px) -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="brand-logo">
          <i data-lucide="wallet-cards" style="width: 20px; height: 20px;"></i>
        </div>
        <div>
          <h2 style="font-size: var(--font-size-base); font-weight: 700; margin: 0;">Sổ Thu Chi</h2>
          <small style="color: var(--text-muted); font-size: 11px;">Local & Firebase Cloud</small>
        </div>
      </div>

      <nav class="sidebar-nav">
        <button class="nav-link active" data-view="dashboard">
          <i data-lucide="layout-dashboard" style="width: 18px; height: 18px;"></i>
          <span>Tổng quan</span>
        </button>
        <button class="nav-link" data-view="transactions">
          <i data-lucide="arrow-left-right" style="width: 18px; height: 18px;"></i>
          <span>Giao dịch</span>
        </button>
        <button class="nav-link" data-view="analytics">
          <i data-lucide="trending-up" style="width: 18px; height: 18px;"></i>
          <span>Báo cáo</span>
        </button>
        <button class="nav-link" data-view="wallets">
          <i data-lucide="wallet" style="width: 18px; height: 18px;"></i>
          <span>Ví</span>
        </button>
        <button class="nav-link" data-view="debts">
          <i data-lucide="hand-coins" style="width: 18px; height: 18px;"></i>
          <span>Vay/Nợ</span>
        </button>
        <button class="nav-link" data-view="budgets">
          <i data-lucide="pie-chart" style="width: 18px; height: 18px;"></i>
          <span>Ngân sách</span>
        </button>
        <button class="nav-link" data-view="settings">
          <i data-lucide="settings" style="width: 18px; height: 18px;"></i>
          <span>Cài đặt</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <button class="btn btn-secondary w-full" id="btn-theme-toggle">
          <i data-lucide="moon" id="theme-icon" style="width: 16px; height: 16px;"></i>
          <span id="theme-text">Chế độ tối</span>
        </button>
      </div>
    </aside>

    <!-- Main Content Area -->
    <div class="main-wrapper">
      <!-- Top Header -->
      <header class="top-header">
        <div class="flex items-center gap-2">
          <button class="header-back-btn" id="btn-header-back" type="button" aria-label="Quay lại" title="Quay lại" style="display: none;">
            <i data-lucide="arrow-left" style="width: 20px; height: 20px;"></i>
          </button>
          <h1 id="page-title" style="font-size: var(--font-size-lg); font-weight: 700; margin: 0;">Tổng quan</h1>
        </div>

        <div class="flex items-center gap-2">
          <div id="sync-status-badge" class="badge badge-subtle" style="cursor: pointer; transition: all 0.2s ease;" role="button" tabindex="0" aria-label="Mở Cài đặt đồng bộ Cloud" title="Mở Cài đặt đồng bộ Cloud">
            <i data-lucide="cloud-off" style="width: 14px; height: 14px;"></i>
            <span id="sync-status-text">Chưa kết nối Cloud</span>
          </div>

          <button class="btn btn-primary" id="btn-add-transaction-header">
            <i data-lucide="plus" style="width: 16px; height: 16px;"></i>
            <span>Ghi giao dịch</span>
          </button>
        </div>
      </header>

      <!-- View Containers -->
      <main class="content-area">
        <section id="view-dashboard" class="view-section active"></section>
        <section id="view-transactions" class="view-section"></section>
        <section id="view-wallets" class="view-section"></section>
        <section id="view-debts" class="view-section"></section>
        <section id="view-budgets" class="view-section"></section>
        <section id="view-analytics" class="view-section"></section>
        <section id="view-settings" class="view-section"></section>
        <section id="view-more" class="view-section"></section>
      </main>
    </div>

    <!-- Mobile Fixed Bottom Navigation Bar (<1024px: exactly 5 items) -->
    <nav class="mobile-nav" aria-label="Điều hướng chính">
      <button class="mobile-nav-item active" data-view="dashboard" type="button">
        <i data-lucide="layout-dashboard" style="width: 20px; height: 20px;"></i>
        <span>Tổng quan</span>
      </button>
      <button class="mobile-nav-item" data-view="transactions" type="button">
        <i data-lucide="arrow-left-right" style="width: 20px; height: 20px;"></i>
        <span>Giao dịch</span>
      </button>
      <button class="mobile-nav-fab" id="btn-fab-add" type="button" aria-label="Ghi giao dịch" title="Ghi giao dịch">
        <i data-lucide="plus" style="width: 24px; height: 24px;"></i>
      </button>
      <button class="mobile-nav-item" data-view="analytics" type="button">
        <i data-lucide="trending-up" style="width: 20px; height: 20px;"></i>
        <span>Báo cáo</span>
      </button>
      <button class="mobile-nav-item" data-view="more" type="button">
        <i data-lucide="more-horizontal" style="width: 20px; height: 20px;"></i>
        <span>Thêm</span>
      </button>
    </nav>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container"></div>

  <!-- Main JavaScript Module -->
  <script type="module" src="./js/app.js"></script>
</body>
</html>
